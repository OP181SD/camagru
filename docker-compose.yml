services:
  web:
    build:
      context: .
      dockerfile: ./docker/php-apache/Dockerfile
    networks:
      - camagru_network
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html

  db:
    image: postgres:14
    env_file:
      - .env
    networks:
      - camagru_network
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql  # Mount the SQL script
    ports:
      - "5432:5432"

  adminer:
    image: adminer
    networks:
      - camagru_network
    ports:
      - "8082:8080"

volumes:
  db_data:

networks:
  camagru_network:
    driver: bridge
